<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0b1220"/>
  <!-- Connecting lines -->
  <line x1="50" y1="50" x2="30" y2="25" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
  <line x1="50" y1="50" x2="70" y2="75" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
  <line x1="50" y1="50" x2="66" y2="28" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
  <line x1="50" y1="50" x2="26" y2="56" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
  <line x1="50" y1="50" x2="40" y2="80" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
  <line x1="30" y1="25" x2="66" y2="28" stroke="#ffffff" stroke-width="1.8" opacity="0.5"/>
  <line x1="26" y1="56" x2="40" y2="80" stroke="#ffffff" stroke-width="1.8" opacity="0.5"/>
  <line x1="40" y1="80" x2="70" y2="75" stroke="#ffffff" stroke-width="1.8" opacity="0.5"/>
  <!-- Central node -->
  <circle cx="50" cy="50" r="7" stroke="#ffffff" stroke-width="3" fill="#0b1220"/>
  <!-- White nodes -->
  <circle cx="30" cy="25" r="7.5" stroke="#ffffff" stroke-width="2.8" fill="#0b1220"/>
  <circle cx="70" cy="75" r="7.5" stroke="#ffffff" stroke-width="2.8" fill="#0b1220"/>
  <!-- Orange accent nodes -->
  <circle cx="66" cy="28" r="5" fill="#e8845a"/>
  <circle cx="26" cy="56" r="5" fill="#e8845a"/>
  <circle cx="40" cy="80" r="5" fill="#e8845a"/>
</svg>